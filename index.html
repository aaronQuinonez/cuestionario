<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Cuestionario interactivo - Auditoría de SI" />
  <meta name="theme-color" content="#6c63ff" />
  <title>Cuestionario Interactivo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Botón de cambio de idioma (fijo, visible en todas las pantallas) -->
  <button id="btn-lang" class="lang-toggle" aria-label="Cambiar idioma / Change language">
    <span id="lang-flag">🇺🇸</span>
    <span id="lang-label">EN</span>
  </button>

  <main id="app" class="app-container">

    <!-- ========================================================
         PANTALLA: INICIO – Selección de sección
    ======================================================== -->
    <section id="screen-start" class="screen screen--active" aria-label="Pantalla de inicio">
      <div class="card start-card">
        <div class="start-icon" aria-hidden="true">🧠</div>
        <h1 class="start-title" data-i18n="appTitle">Cuestionario<br />Interactivo</h1>
        <p class="start-subtitle" data-i18n="appSubtitle">Selecciona una sección para comenzar. Recibirás retroalimentación inmediata en cada pregunta.</p>

        <div class="section-grid">
          <button class="section-btn" id="btn-seccion-teoria">
            <span class="section-btn__emoji" aria-hidden="true">📖</span>
            <span class="section-btn__label" data-i18n="teoriaLabel">Dominio Teoría</span>
            <span class="section-btn__sub" data-i18n="subsCount">5 subsecciones</span>
          </button>
          <button class="section-btn" id="btn-seccion-casos">
            <span class="section-btn__emoji" aria-hidden="true">🔍</span>
            <span class="section-btn__label" data-i18n="casosLabel">Casos de Estudio</span>
            <span class="section-btn__sub" data-i18n="subsCount">5 subsecciones</span>
          </button>
          <button class="section-btn" id="btn-seccion-deepseek">
            <span class="section-btn__emoji" aria-hidden="true">🤖</span>
            <span class="section-btn__label" data-i18n="deepseekLabel">Banco DeepSeek</span>
            <span class="section-btn__sub" data-i18n="deepseekCount">20 preguntas</span>
          </button>
          <button class="section-btn" id="btn-seccion-gemini">
            <span class="section-btn__emoji" aria-hidden="true">✨</span>
            <span class="section-btn__label" data-i18n="geminiLabel">Banco Gemini</span>
            <span class="section-btn__sub" data-i18n="geminiCount">20 preguntas</span>
          </button>
        </div>
      </div>
    </section>

    <!-- ========================================================
         PANTALLA: SUBSECCIONES – Selección de subsección
    ======================================================== -->
    <section id="screen-subsections" class="screen" aria-label="Selección de subsección">
      <div class="card subsections-card">
        <h2 class="subsections-title" id="subsection-title"><!-- JS --></h2>
        <p class="subsections-subtitle" id="subsections-subtitle" data-i18n="chooseSubsection">Elige una subsección para practicar</p>

        <!-- Control de Modo Aleatorio (antes de entrar al cuestionario) -->
        <div class="random-mode-card">
          <div class="random-mode-info">
            <span class="random-mode-icon" aria-hidden="true">🔀</span>
            <div class="random-mode-text">
              <span class="random-mode-title" data-i18n="randomModeTitle">Modo Aleatorio</span>
              <span class="random-mode-desc" data-i18n="randomModeDesc">Mezcla las alternativas en cada pregunta</span>
            </div>
          </div>
          <label class="switch-toggle" for="toggle-random-mode" aria-label="Activar o desactivar modo aleatorio">
            <input type="checkbox" id="toggle-random-mode" />
            <span class="switch-slider" aria-hidden="true"></span>
          </label>
        </div>

        <div class="subsection-grid" id="subsection-grid">
          <!-- JS inserta los botones -->
        </div>
        <button class="btn btn--ghost btn--full" id="btn-back-to-start">
          <span aria-hidden="true">←</span> <span data-i18n="backBtn">Volver al inicio</span>
        </button>
      </div>
    </section>

    <!-- ========================================================
         PANTALLA: PREGUNTA
    ======================================================== -->
    <section id="screen-question" class="screen" aria-label="Pregunta actual" aria-live="polite">
      <header class="quiz-header">
        <div class="progress-info">
          <span class="progress-label">
            <span data-i18n="questionWord">Pregunta</span>
            <span id="question-current">1</span>
            <span data-i18n="ofWord">de</span>
            <span id="question-total">1</span>
            <span id="badge-random-mode" class="badge-random" data-i18n="randomBadge" hidden>🔀 Aleatorio</span>
          </span>
          <span class="score-label"><span data-i18n="scoreWord">Puntos</span>: <strong id="live-score">0</strong></span>
        </div>
        <div class="progress-bar" role="progressbar" aria-label="Progreso del cuestionario" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar__fill" id="progress-fill"></div>
        </div>
      </header>

      <div class="question-card">
        <p class="question-number" aria-hidden="true" id="question-number-label">P.1</p>
        <h2 class="question-text" id="question-text"><!-- JS --></h2>
      </div>

      <ul class="alternatives-list" id="alternatives-list" role="list" aria-label="Alternativas de respuesta">
        <!-- JS inserta los <li> -->
      </ul>

      <!-- Tarjeta de feedback (oculta hasta responder) -->
      <div class="feedback-card" id="feedback-card" aria-live="assertive" hidden>
        <div class="feedback-header">
          <span class="feedback-icon" id="feedback-icon" aria-hidden="true"></span>
          <div class="feedback-status-group">
            <strong class="feedback-status" id="feedback-status"></strong>
            <span id="feedback-reorder-notice" class="feedback-reorder-badge" data-i18n="reorderNotice" hidden></span>
          </div>
        </div>
        <p class="feedback-justification" id="feedback-justification"></p>
      </div>

      <div class="quiz-footer">
        <button class="btn btn--primary btn--full" id="btn-next" hidden>
          <span id="btn-next-text" data-i18n="nextBtn">Siguiente pregunta</span>
          <span class="btn-arrow" aria-hidden="true">→</span>
        </button>
      </div>
    </section>

    <!-- ========================================================
         PANTALLA: RESULTADOS
    ======================================================== -->
    <section id="screen-results" class="screen" aria-label="Pantalla de resultados">
      <div class="card results-card">
        <div class="results-trophy" aria-hidden="true" id="results-trophy">🏆</div>
        <h2 class="results-title" id="results-title">¡Cuestionario completado!</h2>
        <p class="results-subtitle" id="results-subtitle"></p>

        <div class="results-score-ring" aria-label="Puntaje obtenido">
          <svg class="ring-svg" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="ring-bg" cx="60" cy="60" r="50" />
            <circle class="ring-fill" id="ring-fill" cx="60" cy="60" r="50" />
          </svg>
          <div class="ring-label">
            <span class="ring-score" id="ring-score">0</span>
            <span class="ring-total" id="ring-total">/ 0</span>
          </div>
        </div>

        <div class="results-stats" id="results-stats"><!-- JS --></div>

        <button class="btn btn--primary btn--full" id="btn-restart">
          <span data-i18n="restartBtn">Volver al inicio</span>
          <span class="btn-arrow" aria-hidden="true">↩</span>
        </button>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
